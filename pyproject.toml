[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vizdiff"
version = "1.0.0"
description = "Visual regression diffing for screenshots"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0.0"]

[tool.setuptools.packages.find]
include = ["vizdiff*"]

[project.scripts]
vizdiff = "vizdiff.cli:main"
